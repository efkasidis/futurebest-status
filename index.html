<!doctype html>
<html lang="th" data-theme="sky">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8EEFB">
<meta name="robots" content="noindex">
<title>FutureBest สถานะโพสต์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root,[data-theme="sky"]{
  --bg1:#EEF2FB; --bg2:#DCE4F7; --blob1:#A9C4FF; --blob2:#D7C6FF;
  --glass:rgba(255,255,255,.62); --glass-2:rgba(255,255,255,.82); --edge:rgba(255,255,255,.9); --line:rgba(40,60,120,.10);
  --ink:#16203A; --ink-2:#5B6680; --ink-3:#8C95AB;
  --accent:#3D6BF5; --accent-2:#8B5CF6; --accent-soft:rgba(61,107,245,.12);
  --ok:#17A673; --ok-soft:rgba(23,166,115,.13); --bad:#E5484D; --bad-soft:rgba(229,72,77,.12);
  --run:#3D6BF5; --mute:#9AA3B8; --shadow:0 10px 30px -12px rgba(40,60,120,.25);
}
[data-theme="lavender"]{
  --bg1:#F5F0FC; --bg2:#E7DCF8; --blob1:#D9B8FF; --blob2:#FFC2DE;
  --ink:#24163A; --ink-2:#6A5B82; --ink-3:#9A8DB0; --line:rgba(80,40,120,.10);
  --accent:#7C4DFF; --accent-2:#E0559F; --accent-soft:rgba(124,77,255,.12); --run:#7C4DFF;
  --shadow:0 10px 30px -12px rgba(90,50,140,.28);
}
[data-theme="mint"]{
  --bg1:#ECF7F4; --bg2:#D8EEE9; --blob1:#9FE3CF; --blob2:#B9D7FF;
  --ink:#10302A; --ink-2:#4E6F68; --ink-3:#86A39C; --line:rgba(20,90,70,.10);
  --accent:#0E9F84; --accent-2:#3B82F6; --accent-soft:rgba(14,159,132,.12); --run:#0E9F84;
  --shadow:0 10px 30px -12px rgba(20,90,70,.25);
}
[data-theme="night"]{
  --bg1:#12142B; --bg2:#1C1A3A; --blob1:#2C3F8F; --blob2:#4B2A7A;
  --glass:rgba(255,255,255,.07); --glass-2:rgba(255,255,255,.11); --edge:rgba(255,255,255,.14); --line:rgba(255,255,255,.08);
  --ink:#EEF0FF; --ink-2:#AEB4D6; --ink-3:#7C83A8;
  --accent:#7AA2FF; --accent-2:#B38CFF; --accent-soft:rgba(122,162,255,.16); --run:#7AA2FF;
  --ok:#3DD39A; --ok-soft:rgba(61,211,154,.16); --bad:#FF6B7A; --bad-soft:rgba(255,107,122,.16); --mute:#6E759A;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{background:var(--bg1)}
body{margin:0;min-height:100vh;color:var(--ink);font:400 15px/1.55 "IBM Plex Sans Thai",system-ui,sans-serif;
  background:radial-gradient(60% 40% at 10% 0%,var(--blob1) 0%,transparent 70%),radial-gradient(55% 35% at 100% 20%,var(--blob2) 0%,transparent 70%),linear-gradient(180deg,var(--bg1),var(--bg2));
  background-attachment:fixed;-webkit-font-smoothing:antialiased}
main{max-width:520px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 48px}
a{color:var(--accent);text-decoration:none;font-weight:500}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.card{background:var(--glass);border:1px solid var(--edge);border-radius:22px;box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%)}
h2{font-size:15px;font-weight:600;margin:0;color:var(--ink)}
.sec{margin-top:14px;padding:16px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.sec-head small{color:var(--ink-3);font-size:12.5px}

/* หัวหน้า */
.top{display:flex;align-items:center;gap:10px;padding:6px 2px 12px}
.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;box-shadow:var(--shadow)}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:17px;line-height:1.2}
.brand span{font-size:12.5px;color:var(--ink-2)}
.themes{display:flex;gap:6px;padding:5px;border-radius:999px}
.themes button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.themes button[aria-pressed="true"]{border-color:var(--ink)}
.t-sky{background:linear-gradient(135deg,#3D6BF5,#8B5CF6)} .t-lavender{background:linear-gradient(135deg,#7C4DFF,#E0559F)}
.t-mint{background:linear-gradient(135deg,#0E9F84,#3B82F6)} .t-night{background:linear-gradient(135deg,#12142B,#4B2A7A)}

/* การ์ดหลัก */
.hero{padding:18px;display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center}
.ring{width:96px;height:96px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .v b{font-size:24px;font-weight:700}
.ring .v span{display:block;font-size:11.5px;color:var(--ink-2);font-weight:500}
.hero .k{font-size:13px;color:var(--ink-2)}
.hero .t{font-size:24px;font-weight:700;line-height:1.2;margin:2px 0}
.hero .s{font-size:13.5px;color:var(--ink-2)}
.bar{height:6px;border-radius:9px;background:var(--line);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .6s}
.alert{margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--bad-soft);color:var(--bad);font-size:13.5px;font-weight:500}
.alert:empty{display:none}

/* รอบวันนี้ */
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{padding:12px;border-radius:16px;background:var(--glass-2);border:1px solid var(--edge)}
.slot .tm{font-size:19px;font-weight:700;line-height:1.2}
.slot .th{font-size:13px;color:var(--ink-2);margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.c-posted{color:var(--ok);background:var(--ok-soft)}
.c-failed,.c-post_unconfirmed,.c-fail{color:var(--bad);background:var(--bad-soft)}
.c-running,.c-scheduled{color:var(--run);background:var(--accent-soft)}
.c-pending,.c-none,.c-skip{color:var(--ink-3);background:var(--line)}
.c-missed,.c-skipped{color:var(--mute);background:var(--line)}
.slot .mt{font-size:12px;color:var(--ink-3);margin-top:6px;line-height:1.45}

/* ตัวเลข */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.kpi{padding:12px}
.kpi b{display:block;font-size:20px;font-weight:700;line-height:1.2}
.kpi b.warn{color:var(--bad)}
.kpi span{font-size:12px;color:var(--ink-2)}

/* ขั้นตอน */
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:26px 1fr auto;gap:0 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:var(--line)}
.done .dot{background:var(--ok)} .fail .dot{background:var(--bad)} .skip .dot{background:transparent;border:1.5px dashed var(--ink-3)}
.running .dot{background:var(--run);box-shadow:0 0 0 5px var(--accent-soft)}
.wait .dot{background:transparent;border:1.5px solid var(--line)}
.steps .nm{font-size:14px;font-weight:500}
.wait .nm{color:var(--ink-3)}
.steps .tm{font-size:12.5px;color:var(--ink-2);text-align:right;white-space:nowrap}
.steps .tm b{color:var(--ink);font-weight:600}
.running .tm b{color:var(--run)}

/* 7 วัน */
.week{width:100%;border-collapse:collapse;font-size:13px}
.week th{font-weight:500;color:var(--ink-3);font-size:12px;padding:0 0 6px;text-align:center}
.week th:first-child,.week td:first-child{text-align:left}
.week td{padding:7px 0;border-top:1px solid var(--line);text-align:center;color:var(--ink-2)}
.d{display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:middle}
.d.posted{background:var(--ok)} .d.failed,.d.post_unconfirmed{background:var(--bad)} .d.running{background:var(--run)} .d.scheduled{border:2px solid var(--run)}
.d.missed{border:2px solid var(--mute)} .d.skipped{background:var(--mute)} .d.pending{border:1.5px dashed var(--ink-3)} .d.none{background:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .d{width:10px;height:10px}

details{margin-top:14px;padding:4px 16px}
summary{cursor:pointer;padding:10px 0;font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"แสดง";color:var(--accent);font-weight:500;font-size:13px}
details[open] summary::after{content:"ซ่อน"}
.log{list-style:none;margin:0 0 8px;padding:0}
.log li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.log .w{color:var(--ink-3);white-space:nowrap}
footer{text-align:center;color:var(--ink-3);font-size:12px;margin-top:18px}

/* สลับมุมมองรอบวันนี้ */
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--line)}
.seg button{border:0;background:transparent;color:var(--ink-2);font:500 12.5px "IBM Plex Sans Thai",sans-serif;padding:4px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--glass-2);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.clock{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:4px auto 6px}
.clock svg{width:100%;height:100%;overflow:visible;display:block}
.clock .mid{position:absolute;inset:28%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.15}
.clock .mid b{font-size:30px;font-weight:700}
.clock .mid span{font-size:12px;color:var(--ink-2)}
.clist{list-style:none;margin:6px 0 0;padding:0}
.clist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.clist li b{font-weight:700;min-width:46px}
.clist li .th{flex:1;color:var(--ink-2)}
.clist li .mt{font-size:12px;color:var(--ink-3)}
[hidden]{display:none!important}

/* คลิปที่โพสต์แล้ว */
.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.clip{display:block;color:inherit;font-weight:400;border-radius:16px;overflow:hidden;background:var(--glass-2);border:1px solid var(--edge)}
.clip .cv{position:relative;aspect-ratio:9/16;background:var(--line)}
.clip .cv img{width:100%;height:100%;object-fit:cover;display:block}
.clip .du{position:absolute;right:6px;bottom:6px;font-size:11px;font-weight:600;color:#fff;background:rgba(0,0,0,.55);padding:1px 6px;border-radius:6px}
.clip .sch{position:absolute;left:6px;top:6px;font-size:11px;font-weight:600;color:#fff;background:var(--run);padding:2px 7px;border-radius:999px}
.clip .bd{padding:8px 10px 10px}
.clip .tt{font-size:13px;font-weight:600;line-height:1.35}
.clip .hk{font-size:12px;color:var(--ink-2);margin-top:2px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clip .wh{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.stats{display:flex;gap:10px;margin-top:6px;font-size:12px;color:var(--ink-2)}
.stats span{display:inline-flex;align-items:center;gap:3px}
.stats svg{width:13px;height:13px}

/* มุมมองรายการของคลิป */
.gal.list{grid-template-columns:1fr;gap:8px}
.gal.list .clip{display:grid;grid-template-columns:72px 1fr;align-items:stretch}
.gal.list .clip .cv{aspect-ratio:auto;height:100%;min-height:118px}
.gal.list .clip .sch{display:none}
.gal.list .clip .bd{padding:9px 12px}
.more{display:block;text-align:center;margin:12px 0 0;font-size:13.5px;line-height:1.7}
@media (prefers-reduced-motion:no-preference){.running .dot{animation:pulse 1.6s ease-in-out infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 9px transparent}}
@media (max-width:360px){.kpi b{font-size:17px}.hero{grid-template-columns:80px 1fr}.ring{width:80px;height:80px}}
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="logo" aria-hidden="true">F</div>
    <div class="brand"><b>FutureBest</b><span>@futurebest88 โพสต์อัตโนมัติ</span></div>
    <div class="themes card" role="group" aria-label="เลือกธีมสี">
      <button class="t-sky" data-t="sky" aria-label="ธีมฟ้า"></button>
      <button class="t-lavender" data-t="lavender" aria-label="ธีมลาเวนเดอร์"></button>
      <button class="t-mint" data-t="mint" aria-label="ธีมมิ้นต์"></button>
      <button class="t-night" data-t="night" aria-label="ธีมกลางคืน"></button>
    </div>
  </header>

  <section class="card hero" aria-live="polite">
    <div class="ring" id="ring"></div>
    <div id="heroText"></div>
  </section>
  <div class="alert" id="alert" role="status"></div>

  <section class="card sec">
    <div class="sec-head"><h2>รอบของวันนี้ <small id="todayDate" style="font-weight:400"></small></h2>
      <div class="seg" role="group" aria-label="มุมมอง"><button data-v="clock">นาฬิกา</button><button data-v="cards">การ์ด</button></div></div>
    <div id="clockView"><div class="clock"><svg id="clockSvg" viewBox="-160 -160 320 320" role="img" aria-label="นาฬิกา 24 ชั่วโมง แสดงรอบโพสต์วันนี้"></svg><div class="mid" id="clockMid"></div></div><ul class="clist" id="clist"></ul></div>
    <div class="slots" id="slots" hidden></div>
  </section>

  <div class="kpis" id="kpis"></div>

  <section class="card sec">
    <div class="sec-head"><h2>คลิปบน TikTok</h2>
      <div class="seg" id="galSeg" role="group" aria-label="มุมมองคลิป"><button data-g="grid">ตาราง</button><button data-g="list">รายการ</button></div></div>
    <div class="gal" id="gal"></div>
    <p class="more"><small id="galNote" style="color:var(--ink-3)"></small><br><a href="https://www.tiktok.com/@futurebest88" target="_blank" rel="noopener">เปิดช่องบน TikTok</a></p>
  </section>

  <section class="card sec">
    <div class="sec-head"><h2>ขั้นตอนการทำงาน</h2><small id="flowNote"></small></div>
    <ol class="steps" id="steps"></ol>
  </section>

  <section class="card sec">
    <div class="sec-head"><h2>7 วันล่าสุด</h2></div>
    <table class="week" id="week"></table>
    <div class="legend">
      <span><i class="d posted"></i>โพสต์แล้ว</span><span><i class="d failed"></i>ไม่สำเร็จ</span>
      <span><i class="d missed"></i>ไม่ได้รัน</span><span><i class="d skipped"></i>ข้าม (เลยเวลา)</span><span><i class="d scheduled"></i>ตั้งเวลาแล้ว</span>
    </div>
  </section>

  <details class="card"><summary>รันทั้งหมด รวมรอบทดสอบ</summary><ul class="log" id="log"></ul></details>
  <footer id="foot"></footer>
</main>
<script>
const SLOTS=[{h:7,m:0,theme:'การงาน'},{h:9,m:30,theme:'โชคลาภ',since:'2026-11-02'},{h:12,m:0,theme:'การเงิน'},{h:18,m:0,theme:'ความรัก'}];
const FIRST_DAY='2026-11-02';
const LABEL={scheduled:'ตั้งเวลาแล้ว',none:'ยังไม่เริ่ม',posted:'โพสต์แล้ว',failed:'ไม่สำเร็จ',post_unconfirmed:'ไม่แน่ใจ',skipped:'ข้าม',missed:'ไม่ได้รัน',running:'กำลังทำ',pending:'รอเวลา',preview:'ทดสอบ'};
const SIGNS=['มังกร','กุมภ์','มีน','เมษ','พฤษภ','เมถุน','กรกฎ','สิงห์','กันย์','ตุลย์','พิจิก','ธนู'];
const DAYS=['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
const MONTHS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const STEPS=[['trigger','รับสัญญาณจาก GitHub'],['check','ตรวจความพร้อม'],['content','Gemini เขียนคำทำนาย'],['cards','วาดการ์ด 13 ใบ'],
  ['voice','พากย์และตรวจเสียง'],['video','ประกอบคลิป'],['post','โพสต์ TikTok'],['dashboard','อัปเดตแดชบอร์ด']];
const RUNNING_MIN=60;
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
function bkkNow(){const n=new Date();return new Date(n.getTime()+(n.getTimezoneOffset()+420)*60000)}
function bkk(t){const d=new Date(t);return new Date(d.getTime()+(d.getTimezoneOffset()+420)*60000)}
const hm=t=>{const d=bkk(t);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const dm=t=>{const d=bkk(t);return `${d.getDate()} ${MONTHS[d.getMonth()]} ${hm(t)}`};
function dur(a,b){const s=Math.max(0,Math.round((new Date(b)-new Date(a))/1000)),m=Math.floor(s/60),h=Math.floor(m/60);
  return h?`${h} ชม. ${m%60} น.`:m?`${m} น. ${pad(s%60)} วิ`:`${s} วิ`}
function left(ms){const m=Math.max(0,Math.round(ms/60000)),h=Math.floor(m/60);return h?`อีก ${h} ชม. ${m%60} นาที`:`อีก ${m} นาที`}

/* ธีม: จำไว้ในเครื่องนี้ (ถ้าเบราว์เซอร์อนุญาต) */
function setTheme(t){document.documentElement.dataset.theme=t;
  document.querySelectorAll('.themes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t));
  document.querySelector('meta[name=theme-color]').content=getComputedStyle(document.documentElement).getPropertyValue('--bg1').trim();
  try{localStorage.setItem('fb-theme',t)}catch(e){}}
document.querySelectorAll('.themes button').forEach(b=>b.onclick=()=>setTheme(b.dataset.t));
let saved='sky';try{saved=localStorage.getItem('fb-theme')||'sky'}catch(e){}
setTheme(saved);

function slotStatus(runs,date,s,now){
  const key=`${ymd(date)}-${pad(s.h)}`;
  const posts=runs.filter(r=>r.kind==='post'&&r.slot===key);
  const last=posts[posts.length-1];
  if(last){if(last.result==='scheduled'&&last.scheduled_at)return {st:new Date(last.scheduled_at)>new Date()?'scheduled':'posted',run:last};return {st:last.result,run:last}}
  if(ymd(date)<(s.since||FIRST_DAY))return {st:'none'};
  const due=new Date(date);due.setHours(s.h,s.m,0,0);
  if(now<due)return {st:'pending'};
  if(now-due<RUNNING_MIN*60000)return {st:'running'};
  return {st:'missed'};
}


/* มุมมองรอบวันนี้: นาฬิกา (ค่าเริ่มต้น) หรือ การ์ด */
let view='clock';try{view=localStorage.getItem('fb-view')||'clock'}catch(e){}
function setView(v){view=v;$('clockView').hidden=v!=='clock';$('slots').hidden=v!=='cards';
  document.querySelectorAll('.seg button[data-v]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));
  try{localStorage.setItem('fb-view',v)}catch(e){}}
document.querySelectorAll('.seg button[data-v]').forEach(b=>b.onclick=()=>setView(b.dataset.v));
setView(view);
const ST_COLOR={scheduled:'var(--run)',posted:'var(--ok)',failed:'var(--bad)',post_unconfirmed:'var(--bad)',running:'var(--run)',missed:'var(--mute)',skipped:'var(--mute)',pending:'var(--ink-3)',none:'var(--ink-3)'};
function drawClock(t,now){
  const R=118,pt=(hr,r)=>{const a=hr/24*2*Math.PI-Math.PI/2;return [Math.cos(a)*r,Math.sin(a)*r]};
  let g=`<circle r="${R}" fill="none" stroke="var(--line)" stroke-width="14"/>`;
  const [ax,ay]=pt(6,R),[bx,by]=pt(23.99,R);
  g+=`<path d="M${ax} ${ay} A${R} ${R} 0 1 1 ${bx} ${by}" fill="none" stroke="var(--accent-soft)" stroke-width="14" stroke-linecap="round"/>`;
  for(let h=0;h<24;h++){const [x1,y1]=pt(h,R-14),[x2,y2]=pt(h,R-(h%6?18:24));
    g+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--ink-3)" stroke-width="${h%6?1:2}" opacity="${h%6?.45:.8}"/>`;
    if(h%6===0){const [tx,ty]=pt(h,R-36);g+=`<text x="${tx}" y="${ty+4}" text-anchor="middle" fill="var(--ink-3)" font-size="12">${pad(h)}</text>`}}
  const hr=now.getHours()+now.getMinutes()/60,[hx,hy]=pt(hr,R);
  g+=`<circle cx="${hx}" cy="${hy}" r="5" fill="var(--ink)"><title>ตอนนี้</title></circle>`;
  t.forEach(x=>{const h=x.h+x.m/60,[cx,cy]=pt(h,R),[lx,ly]=pt(h,R+26),c=ST_COLOR[x.st]||'var(--ink-3)';
    const solid=['posted','failed','post_unconfirmed','running','skipped'].includes(x.st);
    g+=`<circle cx="${cx}" cy="${cy}" r="11" fill="${solid?c:'var(--glass-2)'}" stroke="${c}" stroke-width="2.5" ${x.st==='pending'?'stroke-dasharray="3 3"':''}/>`
      +(x.st==='posted'?`<path d="M${cx-4.5} ${cy} l3 3 l6 -6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`:'')
      +`<text x="${lx}" y="${ly+4}" text-anchor="middle" fill="var(--ink)" font-size="12" font-weight="600">${pad(x.h)}:${pad(x.m)}</text>`});
  $('clockSvg').innerHTML=g;
  $('clockMid').innerHTML=`<b>${pad(now.getHours())}:${pad(now.getMinutes())}</b><span>เวลาไทยตอนนี้</span>`;
  $('clist').innerHTML=t.map(x=>{const r=x.run||{},mt=[];
    if(r.scheduled_at)mt.push(`โพสต์ ${hm(r.scheduled_at)}`);
    if(r.voice_avg)mt.push(`เสียง ${Math.round(r.voice_avg*100)}%`);
    if(r.sound&&!r.sound.startsWith('failed'))mt.push(esc(r.sound.split(' / ')[0]));
    return `<li><b>${pad(x.h)}:${pad(x.m)}</b><span class="th">ดวง${x.theme}${mt.length?`<br><span class="mt">${mt.join(' / ')}</span>`:''}</span>
      ${r.run_url?`<a href="${esc(r.run_url)}" target="_blank" rel="noopener" class="mt">log</a>`:''}<span class="chip c-${x.st}">${LABEL[x.st]||x.st}</span></li>`}).join('');
}

let runs=[],live=null,etag=null;
function ring(done,total){
  const r=40,c=2*Math.PI*r,p=total?done/total:0;
  $('ring').innerHTML=`<svg viewBox="0 0 96 96" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent-2)"/></linearGradient></defs>
    <circle cx="48" cy="48" r="${r}" fill="none" stroke="var(--line)" stroke-width="9"/>
    <circle cx="48" cy="48" r="${r}" fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c*p} ${c}"/></svg>
    <div class="v"><div><b>${done}/${total}</b><span>โพสต์วันนี้</span></div></div>`;
}

function render(){
  const now=bkkNow(),today=new Date(now);today.setHours(0,0,0,0);
  const t=SLOTS.map(s=>({...s,...slotStatus(runs,today,s,now)}));
  const active=live&&live.run&&live.run.started&&!live.run.finished;
  const counted=t.filter(x=>x.st!=='none');
  ring(t.filter(x=>x.st==='posted').length,counted.length);

  // ข้อความหลัก: กำลังทำ > รอบต่อไป
  const H=$('heroText');
  if(active){
    const st=live.steps||{},idx=STEPS.findIndex(([id])=>st[id]&&st[id].status==='running');
    const doneN=STEPS.filter(([id])=>st[id]&&st[id].end).length;
    const cur=idx>=0?STEPS[idx][1]:'กำลังเตรียม';
    const sl=live.run.slot||'';
    H.innerHTML=`<div class="k">กำลังทำรอบ ${sl?sl.slice(-2)+':'+(sl.endsWith('-09')?'30':'00'):''} ${live.run.theme?'ดวง'+esc(live.run.theme):''}${live.run.kind==='test'?' (ทดสอบ)':''}</div>
      <div class="t">${esc(cur)}</div><div class="s">ขั้นที่ ${Math.min(doneN+1,8)} จาก 8 / ผ่านไป ${dur(live.run.started,new Date())}</div>
      <div class="bar"><i style="width:${Math.round(doneN/8*100)}%"></i></div>`;
  }else{
    let next=t.find(x=>x.st==='pending'),day=new Date(today);
    if(!next){next=SLOTS[0];day.setDate(day.getDate()+1)}
    const due=new Date(day);due.setHours(next.h,next.m,0,0);
    H.innerHTML=`<div class="k">รอบต่อไป</div><div class="t">${pad(next.h)}:${pad(next.m)} ดวง${next.theme}</div><div class="s">${left(due-now)}</div>`;
  }
  const missed=t.filter(x=>x.st==='missed'),bad=t.filter(x=>['failed','post_unconfirmed'].includes(x.st));
  $('alert').textContent=missed.length?`รอบ ${missed.map(x=>pad(x.h)+':'+pad(x.m)).join(', ')} ไม่ได้รัน: เช็กว่าคอมเปิด เสียบปลั๊ก และตัวรับงานขึ้น Listening for Jobs`
    :bad.length?`รอบ ${bad.map(x=>pad(x.h)+':'+pad(x.m)).join(', ')} ไม่สำเร็จ: เปิด log ของรอบนั้นดูสาเหตุ`:'';

  drawClock(t,now);
  $('todayDate').textContent=`${DAYS[today.getDay()]} ${today.getDate()} ${MONTHS[today.getMonth()]}`;
  $('slots').innerHTML=t.map(x=>{const r=x.run||{},mt=[];
    if(r.scheduled_at)mt.push(`โพสต์ ${hm(r.scheduled_at)}`);
    if(r.voice_avg)mt.push(`เสียงตรงบท ${Math.round(r.voice_avg*100)}%`);
    if(r.sound)mt.push(r.sound.startsWith('failed')?'ใส่เพลงไม่สำเร็จ':'เพลง '+esc(r.sound.split(' / ')[0]));
    if(r.run_url)mt.push(`<a href="${esc(r.run_url)}" target="_blank" rel="noopener">ดู log</a>`);
    return `<div class="slot"><div class="tm">${pad(x.h)}:${pad(x.m)}</div><div class="th">ดวง${x.theme}</div>
      <span class="chip c-${x.st}">${LABEL[x.st]||x.st}</span>${mt.length?`<div class="mt">${mt.join('<br>')}</div>`:''}</div>`}).join('');

  // ตัวเลขสุขภาพระบบ
  const rev=[...runs].reverse(),login=rev.find(r=>r.login_days!=null),ld=login?login.login_days:null;
  let ok=0,total=0;for(let i=0;i<7;i++){const d=new Date(today);d.setDate(d.getDate()-i);
    SLOTS.forEach(s=>{const st=slotStatus(runs,d,s,now).st;if(['pending','running','none'].includes(st))return;total++;if(st==='posted')ok++})}
  const vs=rev.filter(r=>r.voice_avg).slice(0,12).map(r=>r.voice_avg);
  $('kpis').innerHTML=`<div class="card kpi"><b class="${ld!=null&&ld<14?'warn':''}">${ld==null?'-':ld+' วัน'}</b><span>ล็อกอิน TikTok</span></div>
    <div class="card kpi"><b>${total?Math.round(ok/total*100)+'%':'-'}</b><span>สำเร็จ 7 วัน${total?` (${ok}/${total})`:''}</span></div>
    <div class="card kpi"><b>${vs.length?Math.round(vs.reduce((a,b)=>a+b)/vs.length*100)+'%':'-'}</b><span>เสียงตรงบท</span></div>`;

  // ขั้นตอน
  if(!live){$('steps').innerHTML='<li><span></span><span class="nm" style="color:var(--ink-3)">จะเริ่มแสดงหลังรอบถัดไป</span><span></span></li>';$('flowNote').textContent=''}
  else{
    const run=live.run||{},st=live.steps||{},last=live.last||{},nowD=new Date();
    $('flowNote').innerHTML=active?'อัปเดตทุก 15 วิ':run.finished?`รอบล่าสุดจบ ${dm(run.finished)}${run.url?` <a href="${esc(run.url)}" target="_blank" rel="noopener">log</a>`:''}`:'';
    $('steps').innerHTML=STEPS.map(([id,nm],i)=>{const c=st[id];let cls='wait',tm='';
      if(c&&c.status==='running'&&active){cls='running';tm=`<b>${dur(c.start,nowD)}</b>`}
      else if(c&&c.end){cls=c.status==='skip'?'skip':c.status==='fail'?'fail':'done';
        tm=cls==='skip'?'ข้าม':id==='trigger'&&run.due?`${hm(c.end)} <b>ช้า ${dur(c.start,c.end)}</b>`:`${hm(c.end)} <b>${dur(c.start,c.end)}</b>`}
      else if(last[id]&&last[id].end){tm=`${dm(last[id].end)} <b>${dur(last[id].start,last[id].end)}</b>`;if(!active)cls=last[id].status==='fail'?'fail':'done'}
      return `<li class="${cls}"><span class="dot">${cls==='done'?'✓':cls==='fail'?'!':''}</span><span class="nm">${nm}</span><span class="tm">${tm}</span></li>`}).join('');
  }

  // 7 วัน
  const week=[];for(let i=0;i<7;i++){const d=new Date(today);d.setDate(d.getDate()-i);week.push(d)}
  $('week').innerHTML=`<thead><tr><th>วัน</th>${SLOTS.map(s=>`<th>${pad(s.h)}:${pad(s.m)}</th>`).join('')}</tr></thead><tbody>`+
    week.map(d=>`<tr><td>${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}</td>${SLOTS.map(s=>{const x=slotStatus(runs,d,s,now);
      const lab=`${s.theme} ${LABEL[x.st]||x.st}`,dot=`<i class="d ${x.st}" title="${lab}" aria-label="${lab}"></i>`;
      return `<td>${x.run&&x.run.run_url?`<a href="${esc(x.run.run_url)}" target="_blank" rel="noopener">${dot}</a>`:dot}</td>`}).join('')}</tr>`).join('')+'</tbody>';

  $('log').innerHTML=rev.slice(0,40).map(r=>`<li><span><span class="chip c-${r.kind==='post'?r.result:'pending'}">${r.kind==='post'?LABEL[r.result]||r.result:'ทดสอบ'}</span> ดวง${esc(r.theme)}</span>
    <span class="w">${dm(r.ts)}${r.run_url?` <a href="${esc(r.run_url)}" target="_blank" rel="noopener">log</a>`:''}</span></li>`).join('')||'<li>ยังไม่มีการรัน</li>';
  $('foot').textContent=rev[0]?`ข้อมูลล่าสุด ${dm(rev[0].ts)}`:'';
}


/* คลิปที่โพสต์จริงบน TikTok (อ่านจาก TikTok Studio ทุกครั้งที่ระบบรัน) */
const ICO={v:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
 l:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></svg>',
 c:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z"/></svg>'};
const fmtN=n=>n==null?'-':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n);
function renderGallery(d){
  const posts=(d.posts||[]).filter(p=>p.when&&p.when.includes('T')&&p.when>='2026-11-01').slice(0,12);
  $('galNote').textContent=d.synced_at?`ข้อมูลจาก TikTok เมื่อ ${dm(d.synced_at)}`:'';
  $('gal').innerHTML=posts.map(p=>{const t=p.when&&p.when.includes('T')?dm(p.when):esc(p.when||'');
    return `<a class="clip" href="${esc(p.url)}" target="_blank" rel="noopener"><div class="cv"><img src="${esc(p.cover)}" alt="ปกคลิป ${esc(p.title)}" loading="lazy" onerror="this.style.display='none'">
      ${p.scheduled?`<span class="sch">ตั้งเวลา ${t}</span>`:''}${p.duration?`<span class="du">${esc(p.duration)}</span>`:''}</div>
      <div class="bd"><div class="tt">${esc(p.title)}</div>${p.hook?`<div class="hk">${esc(p.hook)}</div>`:''}<div class="wh">${p.scheduled?'ตั้งเวลาโพสต์ '+t:'โพสต์ '+t}</div>
      ${p.scheduled?'':`<div class="stats"><span>${ICO.v}${fmtN(p.views)}</span><span>${ICO.l}${fmtN(p.likes)}</span><span>${ICO.c}${fmtN(p.comments)}</span></div>`}</div></a>`}).join('')
    ||'<p style="grid-column:1/-1;color:var(--ink-3);font-size:13px;margin:0">จะแสดงหลังระบบอ่านรายการโพสต์จาก TikTok ครั้งแรก</p>';
}

let galView='grid';try{galView=localStorage.getItem('fb-gal')||'grid'}catch(e){}
function setGal(v){galView=v;$('gal').classList.toggle('list',v==='list');
  document.querySelectorAll('#galSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.g===v));
  try{localStorage.setItem('fb-gal',v)}catch(e){}}
document.querySelectorAll('#galSeg button').forEach(b=>b.onclick=()=>setGal(b.dataset.g));
setGal(galView);
fetch('data/posts.json?'+Date.now()).then(r=>r.ok?r.json():{}).catch(()=>({})).then(renderGallery);

const parts=location.hostname.endsWith('github.io')?[location.hostname.split('.')[0],location.pathname.split('/')[1]]:['efkasidis','futurebest-status'];
const LIVE_URL=`https://api.github.com/repos/${parts[0]}/${parts[1]}/contents/data/live.json?ref=live`;
const RAW_URL=`https://raw.githubusercontent.com/${parts[0]}/${parts[1]}/live/data/live.json`;
let apiBlockedUntil=0;
async function fetchLive(){
  // ทางหลัก: GitHub API (สดทันที คำขอที่ไม่มีอะไรเปลี่ยนไม่นับโควตา) ถ้าโดนจำกัดโควตา ใช้สำเนาจาก CDN (ช้าได้ถึง 5 นาที) ไปก่อน 10 นาที
  if(Date.now()>apiBlockedUntil){
    try{const r=await fetch(LIVE_URL,{headers:Object.assign({Accept:'application/vnd.github.raw+json'},etag?{'If-None-Match':etag}:{}),cache:'no-store'});
      if(r.status===304)return null;
      if(r.ok){etag=r.headers.get('ETag');return await r.json()}
      apiBlockedUntil=Date.now()+10*60000;
    }catch(e){apiBlockedUntil=Date.now()+10*60000}
  }
  try{const r=await fetch(RAW_URL+'?t='+Date.now(),{cache:'no-store'});if(r.ok)return await r.json()}catch(e){}
  return null;
}
async function pollLive(){
  const got=await fetchLive();
  if(got){const was=live&&live.run&&live.run.finished;live=got;if(!was&&live.run&&live.run.finished)loadRuns()}
  render();
  setTimeout(pollLive,(live&&live.run&&live.run.started&&!live.run.finished)?20000:60000);
}
function loadRuns(){return fetch('data/runs.json?'+Date.now()).then(r=>r.ok?r.json():[]).catch(()=>[]).then(d=>{runs=d;render()})}
loadRuns().then(pollLive);
setInterval(render,5000);
</script>
